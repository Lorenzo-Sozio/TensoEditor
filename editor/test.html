<!DOCTYPE html>
<html lang="en">

<head>
    <title>three.js webgl - STL</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/three.js/110/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.110/examples/js/controls/OrbitControls.js"></script>
    <script src="/STLLoader.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <!-- Div which will hold the Output -->
    <div id="WebGL-output">
    </div>

    <script>
        // Necessary for camera/plane rotation
        var degree = Math.PI / 180;

        // Setup
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        var renderer = new THREE.WebGLRenderer();

        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Resize after viewport-size-change
        window.addEventListener("resize", function () {
            var height = window.innerHeight;
            var width = window.innerWidth;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });

        // Adding controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);

        // Ground (comment out line: "scene.add( plane );" if Ground is not needed...)
        var plane = new THREE.Mesh(
            new THREE.PlaneBufferGeometry(500, 500),
            new THREE.MeshPhongMaterial({ color: 0x999999, specular: 0x101010 })
        );
        plane.rotation.x = -90 * degree;
        plane.position.y = 0;
        scene.add(plane);
        plane.receiveShadow = true;


        const { STLLoader } = await import('three/addons/loaders/STLLoader.js');

        loader.load('./assets/Tenda 02 vers 2024.stl', function (geometry) {

            let meshMaterial = new THREE.MeshPhongMaterial( { color: 0xff9c7c, specular: 0x494949, shininess: 200 } );

            if (geometry.hasColors) {
                meshMaterial = new THREE.MeshPhongMaterial({ opacity: geometry.alpha, vertexColors: true });
            }

            const mesh = new THREE.Mesh(geometry, meshMaterial);

            mesh.position.set(0.5, 0.2, 0);
            mesh.rotation.set(- Math.PI / 2, Math.PI / 2, 0);
            mesh.scale.set(0.3, 0.3, 0.3);

            mesh.castShadow = true;
            mesh.receiveShadow = true;

            scene.add(mesh);

        });



        // Camera positioning
        camera.position.z = 100;
        camera.position.y = 100;
        camera.rotation.x = -45 * degree;

        // Ambient light (necessary for Phong/Lambert-materials, not for Basic)
        var ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);

        // Draw scene
        var render = function () {
            renderer.render(scene, camera);
        };

        // Run game loop (render,repeat)
        var GameLoop = function () {
            requestAnimationFrame(GameLoop);

            render();
        };

        GameLoop();
    </script>



</body>

</html>
